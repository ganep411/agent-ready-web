name: Windows tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Run the procurement CLI against the demo catalog
        shell: pwsh
        run: |
          $env:CATALOG_ADAPTER = 'demo'
          $result = python -m examples.procurement_agent 'USB-C Chargerを、型番DEMO-65、電圧20 V、容量65 W、2個見積もって' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.status -ne 'quoted' -or $result.reference_quotes[0].total_price -ne '7960') {
            throw 'Procurement CLI smoke test failed'
          }
